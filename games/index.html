<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game lalulalang studio</title>
<meta name="description" content="Semua game mobile gratis dari lalulalang studio, langsung ke Google Play.">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #22201d; --muted: #6b665f;
    --border: #e4e0d8; --accent: #d9480f; --chip: #efece6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #181715; --card: #23211e; --text: #f1eee9; --muted: #a8a299;
      --border: #3a3631; --accent: #ff8a4c; --chip: #2e2b27;
    }
  }
  body {
    margin: 0; padding: 40px 16px; background: var(--bg); color: var(--text);
    font-family: system-ui, "Segoe UI", sans-serif; line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.8rem; }
  h2 { margin: 32px 0 12px; font-size: 1.1rem; }
  .muted { color: var(--muted); }
  .games { display: grid; gap: 14px; }
  .card {
    display: flex; gap: 16px; align-items: center;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px;
  }
  .card img { width: 72px; height: 72px; border-radius: 16px; flex: none; }
  .card .body { flex: 1; min-width: 0; }
  .card h3 { margin: 0; font-size: 1.05rem; }
  .card p { margin: 2px 0 8px; }
  .chip {
    display: inline-block; font-size: .78rem; padding: 1px 8px; border-radius: 999px;
    background: var(--chip); color: var(--muted); margin-right: 6px;
  }
  .play {
    display: inline-block; padding: 6px 14px; border-radius: 10px;
    background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: .92rem;
  }
  .soon .card { opacity: .78; }
  a { color: var(--accent); }
  footer { margin-top: 36px; font-size: .9rem; }
  @media (max-width: 420px) { .card img { width: 56px; height: 56px; border-radius: 12px; } }
</style>
</head>
<body>
<main>
  <p><a href="../">← lalulalang studio</a></p>
  <h1>Game kami</h1>
  <p class="muted">Semua game lalulalang studio, langsung ke Google Play.
    <a href="https://play.google.com/store/apps/dev?id=6151755212259274662">Halaman developer kami di Google Play →</a></p>

  <section>
    <h2>Di Google Play</h2>
    <div class="games" id="on-play"><p class="muted">Memuat…</p></div>
  </section>

  <section class="soon" id="soon-section" hidden>
    <h2>Segera hadir</h2>
    <div class="games" id="soon"></div>
  </section>

  <noscript><p>Aktifkan JavaScript untuk melihat daftar game, atau buka <a href="../">halaman utama</a>.</p></noscript>

  <footer class="muted">
    Daftar ini dibaca dari <a href="../games.json">games.json</a>, sumber yang sama dengan menu
    "More games" di dalam game kami.<br>
    Kontak: <a href="mailto:lalulalangstudio@gmail.com">lalulalangstudio@gmail.com</a>
  </footer>
</main>
<script>
  // One source of truth: ../games.json. Edit that file to add a game or flip "onPlay" when it goes live.
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function card(g) {
    const play = "https://play.google.com/store/apps/details?id=" + encodeURIComponent(g.package);
    const action = g.onPlay
      ? `<a class="play" href="${play}">Google Play</a>`
      : `<span class="chip">Segera hadir</span>`;
    const privacy = g.privacy ? ` · <a href="../${esc(g.privacy)}">Privasi</a>` : "";
    return `<article class="card">
        <img src="../${esc(g.icon)}" alt="" loading="lazy" width="72" height="72">
        <div class="body">
          <h3>${esc(g.title)}</h3>
          <p class="muted">${esc(g.tagline_id)}</p>
          <span class="chip">${esc(g.genre)}</span>${action}<span class="muted">${privacy}</span>
        </div>
      </article>`;
  }

  fetch("../games.json", { cache: "no-cache" })
    .then(r => r.json())
    .then(data => {
      const games = data.games || [];
      const live = games.filter(g => g.onPlay), soon = games.filter(g => !g.onPlay);
      document.getElementById("on-play").innerHTML = live.map(card).join("") || '<p class="muted">Belum ada.</p>';
      if (soon.length) {
        document.getElementById("soon").innerHTML = soon.map(card).join("");
        document.getElementById("soon-section").hidden = false;
      }
    })
    .catch(() => {
      document.getElementById("on-play").innerHTML = '<p class="muted">Daftar game gagal dimuat. Coba muat ulang halaman.</p>';
    });
</script>
</body>
</html>
